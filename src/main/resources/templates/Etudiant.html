<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Étudiants</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .center-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 5px;
            border-left: 4px solid rgb(0, 128, 192);
            font-size: 16px;
        }

        .center-info strong {
            color: rgb(0, 128, 192);
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th {
            background-color: rgb(0, 128, 192);
            color: white;
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            color: #333;
        }

        tbody tr:hover {
            background-color: #e8f4f8;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <h2>📚 Liste des Étudiants</h2>

    <!-- Afficher le centre d'information -->
    <div class="center-info">
        <p><strong>Centre d'information :</strong> <span th:text="${centerV}">Aucun centre</span></p>
    </div>

    <!-- Tableau des étudiants -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Âge</th>
                <th>Email</th>
                <th>État</th>
            </tr>
        </thead>
        <tbody>
            <!-- Boucle sur le tableau d'étudiants -->
            <tr th:each="etudiant : ${etudiants}">
                <td th:text="${etudiant.id}"></td>
                <td th:text="${etudiant.nom}"></td>
                <td th:text="${etudiant.prenom}"></td>
                <td th:text="${etudiant.age}"></td>
                <td th:text="${etudiant.mail}"></td>
                <td th:text="${etudiant.etat}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
